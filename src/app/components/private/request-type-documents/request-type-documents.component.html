<div class="row mb-2">
  <div class="col-10">
    <div class="title-page">Asociar Documentos a tipo de solicitud</div>
  </div>
</div>

<div class="row">

  <!-- Selección de tipo de solicitud -->
  <div class="p-field">
    <label for="requestType">Tipo de Solicitud</label>
    <p-dropdown 
        [options]="requestTypeList"
        optionLabel="request_type_name"
        optionValue="request_type_id"
        [(ngModel)]="selectedRequestTypeId"
        placeholder="Seleccione un tipo de solicitud"
        [showClear]="true">
    </p-dropdown>
  </div>

  <!-- Tabla de documentos -->
  <p-table [value]="documents" *ngIf="selectedRequestTypeId">
    <ng-template pTemplate="header">
      <tr>
        <th>Documento</th>
        <th>Obligatorio</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-doc>
      <tr>
        <td>{{ doc.documentName }}</td>
        <td>{{ doc.mandatory ? 'Sí' : 'No' }}</td>
        <td>{{ doc.status }}</td>
        <td>
          <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text"></button>
          <!-- <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger p-button-text" (click)="deleteDocument(doc)"></button> -->
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Botón agregar documento -->
  <div class="p-mt-3">
    <button pButton label="Gestionar Documentos" icon="pi pi-plus" 
      (click)="openDialog()" [disabled]="!selectedRequestTypeId">
    </button>
  </div>

  <!-- Modal con PickList -->
  <p-dialog 
    header="Asociar Documentos" 
    [(visible)]="displayDialog" 
    [modal]="true" 
    [style]="{width: '700px'}"
    [draggable]="false" 
    [resizable]="false">

    <!--
    <p-pickList 
      [source]="availableDocuments" 
      [target]="associatedDocuments" 
      sourceHeader="Disponibles" 
      targetHeader="Asociados"
      [dragdrop]="true" 
      [showSourceControls]="true" 
      [showTargetControls]="true" 
      optionLabel="document_type_name"
      (onMoveToTarget)="onAssociationChange()"
      (onMoveToSource)="onAssociationChange()">
    </p-pickList>
    -->
    <p-pickList 
  [source]="availableDocuments" 
  [target]="associatedDocuments" 
  sourceHeader="Disponibles" 
  targetHeader="Asociados"
  [dragdrop]="true" 
  [showSourceControls]="true" 
  [showTargetControls]="true"
  (onMoveToTarget)="onAssociationChange()"
  (onMoveToSource)="onAssociationChange()">

  <!-- Template para los ítems -->
  <ng-template let-doc pTemplate="item">
    <div style="padding:4px 8px; font-size:14px; color:#000;">
      {{ doc.document_type_name }}
    </div>
  </ng-template>
</p-pickList>

    <ng-template pTemplate="footer">
      <button pButton label="Cancelar" class="p-button-text" (click)="displayDialog=false"></button>
      <!-- <button pButton label="Guardar" icon="pi pi-check" (click)="saveAssociations()"></button> -->
    </ng-template>
  </p-dialog>

</div>
