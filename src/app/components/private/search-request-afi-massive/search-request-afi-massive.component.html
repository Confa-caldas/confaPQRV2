<div class="row mb-2">
  <div class="col-10">
    <div class="title-page">Consultar solicitudes de Afiliación Masivas</div>
  </div>
</div>
<form [formGroup]="formGroup" (keydown.enter)="initPaginador()"
(keydown.escape)="cleanForm()">
  <div class="position-relative">
    <div class="card flex justify-content-center absolute-center">
      <div class="filters-grid">
        <div class="filters-cell">
          <input
            pInputText
            class="filters-input"
            pKeyFilter="int"
            placeholder="Número de radicado"
            formControlName="filing_number" />
        </div>
        <div class="filters-cell">
          <p-calendar
            formControlName="dates_range"
            selectionMode="range"
            [readonlyInput]="true"
            [style]="{ 'align-items': 'center', 'border-radius': '5px' }"
            [iconDisplay]="'input'"
            [showIcon]="true"
            placeholder="Rango de fechas"
            class="calendar"></p-calendar>
        </div>
        <div class="filters-cell">
          <input
            pInputText
            pKeyFilter="text"
            class="filters-input"
            placeholder="Número de documento empresa"
            formControlName="doc_id_emp" />
        </div>
        <div class="filters-cell">
          <p-multiSelect
            formControlName="request_status_id"
            [style]="{ height: '28px', 'align-items': 'center', 'border-radius': '5px' }"
            [options]="statusList"
            optionLabel="status_name"
            optionValue="request_status_id"
            placeholder="Tipo de estado"></p-multiSelect>
        </div>
        <div class="filters-cell filters-actions">
          <p-button
            icon="pi pi-trash"
            [styleClass]="'btn-icon-info'"
            (click)="cleanForm()"></p-button>
          <p-button
            icon="pi pi-search"
            [styleClass]="'btn-icon-info'"
            (click)="initPaginador()"></p-button>
        </div>
      </div>
    </div>
  </div>
</form>

<button
  *ngIf="selectedRequests.length > 0"
  pButton
  type="button"
  label="Asignar seleccionadas"
  icon="pi pi-users"
  class="p-button-success assign-bulk-btn"
  (click)="assignSelectedRequests(selectedRequests)"
  [disabled]="!selectedRequests || selectedRequests.length === 0">
</button>

<div class="mai-table-wrap mt-auto">
  <p-table
    #dt
    [value]="requestList"
    dataKey="request_id"
    [rows]="10"
    [showCurrentPageReport]="true"
    [loading]="loading"
    [paginator]="false"
    currentPageReportTemplate="{first} de {totalRecords}"
    [tableStyle]="{ 'min-width': '50rem' }"
    [scrollable]="true"
    scrollHeight="500px"
    [virtualScroll]="false"
    [virtualScrollItemSize]="80"
    [(selection)]="selectedRequests"
    [exportHeader]="'customExportHeader'">
    <ng-template pTemplate="header">
      <tr class="mai-table-header-row">
        <th style="width: 3rem">
          <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
        </th>
        <th style="width: 3rem" class="mai-col-accion"></th>
        <th pSortableColumn="filing_number" style="min-width: 9rem">
          Número de solicitud<p-sortIcon field="filing_number"></p-sortIcon>
        </th>
        <th pSortableColumn="filing_date" style="min-width: 8rem">
          Fecha de solicitud<p-sortIcon field="filing_date"></p-sortIcon>
        </th>
        <th pSortableColumn="doc_id" style="min-width: 11rem">
          Número de documento empresa<p-sortIcon field="doc_id"></p-sortIcon>
        </th>
        <th pSortableColumn="applicant_name" style="min-width: 14rem">
          Nombre empresa<p-sortIcon field="applicant_name"></p-sortIcon>
        </th>
        <th pSortableColumn="status_name" style="min-width: 10rem">
          Estado solicitud<p-sortIcon field="status_name"></p-sortIcon>
        </th>
        <th style="width: 10rem" class="mai-col-asignar"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <p-tableCheckbox
            [value]="row"
            *ngIf="row.status_name === 'Radicada' && PERFIL !== 'CONSULTANTE'"></p-tableCheckbox>
        </td>
        <td>
          <p-button
            icon="pi pi-eye"
            [styleClass]="'btn-icon-info'"
            (click)="redirectDetails(row.request_id)"
            pTooltip="Visualizar detalle"
            tooltipPosition="top"></p-button>
        </td>
        <td style="text-align: center">{{ row.filing_number }}</td>
        <td style="text-align: center">{{ row.filing_date_date | date: 'dd/MM/yyyy' }}</td>
        <td style="text-align: center">{{ row.doc_id || '—' }}</td>
        <td style="text-align: center">{{ row.applicant_name || '—' }}</td>
        <td style="text-align: center">{{ row.status_name || '—' }}</td>
        <td>
          <div *ngIf="row.status_name !== 'Cerrada' && PERFIL !== 'CONSULTANTE'">
            <button class="custom-button" type="button" (click)="assignRequest(row)">
              {{
                row.assigned_user === null || row.assigned_user === ''
                  ? 'Asignar'
                  : 'Reasignar'
              }}
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <p-paginator
    (onPageChange)="onPageChange($event)"
    [first]="first"
    [rows]="rows"
    [totalRecords]="totalRows"
    [rowsPerPageOptions]="[10, 20, 30]">
  </p-paginator>
</div>

<p-toast></p-toast>
<app-modal-dinamic
  *ngIf="visibleDialog"
  [select]="true"
  [visible]="visibleDialog"
  [message]="message"
  (setRta)="closeDialog($event)"></app-modal-dinamic>

<app-modal-assign-selector
  *ngIf="visibleDialogInput"
  [visible]="visibleDialogInput"
  [message]="message"
  [buttonmsg]="buttonmsg"
  [parameter]="parameter"
  (setRta)="closeDialogInput($event)"
  (setRtaParameter)="setParameter($event)"></app-modal-assign-selector>

<app-modal-alert
  *ngIf="visibleDialogAlert"
  [select]="true"
  [visible]="visibleDialogAlert"
  [message]="message"
  [message2]="message2"
  [informative]="informative"
  [severity]="severity"
  (setRta)="closeDialogAlert($event)"></app-modal-alert>
