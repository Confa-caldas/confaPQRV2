<div class="row mb-2">
  <div class="col-10">
    <div class="title-page">Parametrizar bancos</div>
  </div>
  <div class="col-2">
    <p-button label="Crear nueva" (click)="createGender()"></p-button>
  </div>
</div>
<div class="row mt-auto">
  <div class="col-12">
    <p-table
      [value]="bankList"
      [scrollable]="true"
      scrollHeight="600px"
      selectionMode="single"
      [paginator]="false"
      [rows]="20"
      [showCurrentPageReport]="true"
      [tableStyle]="{ 'min-width': '50rem' }"
      currentPageReportTemplate="{first} de {totalRecords}">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id_entidad" style="width: 3%">
            Código<p-sortIcon field="id_entidad"></p-sortIcon>
          </th>
          <th style="width: 20%">Nombre entidad</th>
          <th style="width: 10%">Tipo entidad</th>
          <th style="width: 8%">Código entidad</th>
          <th style="width: 10%">Estado</th>
          <th style="width: 3%"></th>
          <th style="width: 3%"></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-bankList>
        <tr>
          <td [ngStyle]="{ 'text-align': 'center' }">{{ bankList.id_entidad }}</td>
          <td [ngStyle]="{ 'text-align': 'center' }">{{ bankList.nombre_entidad }}</td>
          <td [ngStyle]="{ 'text-align': 'center' }">{{ bankList.tipo_entidad }}</td>
          <td [ngStyle]="{ 'text-align': 'center' }">{{ bankList.codigo_entidad }}</td>

          <td [ngStyle]="{ 'text-align': 'center' }">
            <div class="d-flex flex-column align-items-center gap-1">
              <p-inputSwitch
                [(ngModel)]="bankList.esta_activa"
                (onChange)="inActiveGender(bankList)">
              </p-inputSwitch>
              <div [ngClass]="{ 'input-switch-label': bankList.esta_activa }">
                {{ bankList.esta_activa ? 'Activo' : 'Inactivo' }}
              </div>
            </div>
          </td>

          <td [ngStyle]="{ 'text-align': 'center' }">
            <p-button
              icon="pi pi-pencil"
              [styleClass]="'btn-icon-warning'"
              (click)="editGender(bankList)"></p-button>
          </td>
          <td [ngStyle]="{ 'text-align': 'center' }">
            <p-button
              icon="pi pi-eye"
              [styleClass]="'btn-icon-info'"
              (click)="displayGender(bankList)"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
    <p-paginator
      (onPageChange)="onPageChange($event)"
      [first]="first"
      [rows]="rows"
      [totalRecords]="totalRows"
      [rowsPerPageOptions]="[10, 20, 30]"></p-paginator>
  </div>
</div>
<p-toast></p-toast>
<app-modal-dinamic
  *ngIf="visibleDialog"
  [select]="true"
  [visible]="visibleDialog"
  [message]="message"
  (setRta)="closeDialog($event)"></app-modal-dinamic>

  <app-modal-alert
  *ngIf="visibleDialogAlert"
  [select]="true"
  [visible]="visibleDialogAlert"
  [message]="message"
  [informative]="informative"
  [severity]="severity"
  (setRta)="closeDialogAlert($event)"></app-modal-alert>

  <app-modal-bank
  *ngIf="visibleDialogCategory"
  [select]="true"
  [visible]="visibleDialogCategory"
  [message]="message"
  [buttonmsg]="buttonmsg"
  [read_only]="read_only"
  [bankForm]="bank_details"
  (setRta)="closeDialogGender($event)"
  (setRtaParameter)="setParameter($event)"></app-modal-bank>
