<div class="row mb-2">
  <div class="col-10">
    <div class="title-page">Parametrizar Entidades</div>
  </div>
  <div class="col-2">
    <p-button label="Crear tipo entidad" (click)="createEntity()"></p-button>
  </div>
</div>
<div class="row">
  <div class="col-12">
    <p-table
      [value]="entityList"
      [scrollable]="true"
      scrollHeight="400px"
      selectionMode="single"
      [paginator]="false"
      [rows]="20"
      [showCurrentPageReport]="true"
      [tableStyle]="{ 'min-width': '50rem' }"
      currentPageReportTemplate="{first} de {totalRecords}">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="entity_code" style="width: 35%">
            Código<p-sortIcon field="entity_code"></p-sortIcon>
          </th>
          <th pSortableColumn="entity_name" style="width: 35%">
            Nombre entidad<p-sortIcon field="entity_name"></p-sortIcon>
          </th>
          <th pSortableColumn="entity_type_name" style="width: 35%">
            Tipo entidad<p-sortIcon field="entity_type_name"></p-sortIcon>
          </th>
          <th pSortableColumn="is_active" style="width: 15%">
            Estado<p-sortIcon field="is_active"></p-sortIcon>
          </th>
          <th style="width: 15%"></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-entityList>
        <tr>
          <td style="text-align: center">
            {{ entityList.entity_code }}
          </td>
          <td style="text-align: center">
            {{ entityList.entity_name }}
          </td>
          <td style="text-align: center">
            {{ entityList.entity_type_name }}
          </td>
          <td class="d-flex" [ngStyle]="{ 'text-align': 'center' }">
            <p-inputSwitch
              [(ngModel)]="entityList.is_active"
              (onChange)="inActiveEntity(entityList)"></p-inputSwitch>
            <div
              class="d-flex align-items-center ms-2"
              [ngClass]="{ 'input-switch-label': entityList.is_active }">
              {{ entityList.is_active ? 'Activo' : 'Inactivo' }}
            </div>
          </td>
          <td [ngStyle]="{ 'text-align': 'center' }">
            <p-button
              icon="pi pi-pencil"
              [styleClass]="'btn-icon-warning'"
              (click)="editEntity(entityList)"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
    <p-paginator
      (onPageChange)="onPageChange($event)"
      [first]="first"
      [rows]="rows"
      [totalRecords]="totalRows"
      [rowsPerPageOptions]="[10, 20, 30]"></p-paginator>
  </div>
</div>
<p-toast></p-toast>
<app-modal-dinamic
  *ngIf="visibleDialog"
  [select]="true"
  [visible]="visibleDialog"
  [message]="message"
  (setRta)="closeDialog($event)"></app-modal-dinamic>

<app-modal-alert
  *ngIf="visibleDialogAlert"
  [select]="true"
  [visible]="visibleDialogAlert"
  [message]="message"
  [informative]="informative"
  [severity]="severity"
  (setRta)="closeDialogAlert($event)"></app-modal-alert>

<app-modal-entity
  *ngIf="visibleDialogEntity"
  [select]="true"
  [visible]="visibleDialogEntity"
  [message]="message"
  [buttonmsg]="buttonmsg"
  [read_only]="read_only"
  [entityForm]="entity_details"
  (setRta)="closeDialogEntity($event)"
  (setRtaParameter)="setParameter($event)"></app-modal-entity>
