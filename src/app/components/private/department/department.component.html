<div class="row mb-2">
  <div class="col-10">
    <div class="title-page">Parametrizar departamento</div>
  </div>
  <div class="col-2">
    <p-button label="Crear nueva" (click)="createDepartment()"></p-button>
  </div>
</div>
<div class="row mt-auto">
  <div class="col-12">
    <p-table
      [value]="departmentList"
      [scrollable]="true"
      scrollHeight="600px"
      selectionMode="single"
      [paginator]="false"
      [rows]="20"
      [showCurrentPageReport]="true"
      [tableStyle]="{ 'min-width': '50rem' }"
      currentPageReportTemplate="{first} de {totalRecords}">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id" style="width: 3%">
            Id<p-sortIcon field="id"></p-sortIcon>
          </th>
          <th style="width: 8%">Código departamento</th>
          <th style="width: 10%">Departamento</th>
          <th style="width: 8%">Estado</th>
          <th style="width: 3%"></th>
          <th style="width: 3%"></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-departmentList>
        <tr>
          <td [ngStyle]="{ 'text-align': 'center' }">{{ departmentList.id }}</td>
          <td [ngStyle]="{ 'text-align': 'center' }">{{ departmentList.codigo_departamento }}</td>
          <td [ngStyle]="{ 'text-align': 'center' }">{{ departmentList.nombre_departamento }}</td>

          <td [ngStyle]="{ 'text-align': 'center' }">
            <div class="d-flex flex-column align-items-center gap-1">
              <p-inputSwitch
                [(ngModel)]="departmentList.esta_activo"
                (onChange)="inActiveDepartment(departmentList)">
              </p-inputSwitch>
              <div [ngClass]="{ 'input-switch-label': departmentList.esta_activo }">
                {{ departmentList.esta_activo ? 'Activo' : 'Inactivo' }}
              </div>
            </div>
          </td>

          <td [ngStyle]="{ 'text-align': 'center' }">
            <p-button
              icon="pi pi-pencil"
              [styleClass]="'btn-icon-warning'"
              (click)="editDepartment(departmentList)"></p-button>
          </td>
          <td [ngStyle]="{ 'text-align': 'center' }">
            <p-button
              icon="pi pi-eye"
              [styleClass]="'btn-icon-info'"
              (click)="displayDepartment(departmentList)"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
    <p-paginator
      (onPageChange)="onPageChange($event)"
      [first]="first"
      [rows]="rows"
      [totalRecords]="totalRows"
      [rowsPerPageOptions]="[10, 20, 30]"></p-paginator>
  </div>
</div>
<p-toast></p-toast>
<app-modal-dinamic
  *ngIf="visibleDialog"
  [select]="true"
  [visible]="visibleDialog"
  [message]="message"
  (setRta)="closeDialog($event)"></app-modal-dinamic>

  <app-modal-alert
  *ngIf="visibleDialogAlert"
  [select]="true"
  [visible]="visibleDialogAlert"
  [message]="message"
  [informative]="informative"
  [severity]="severity"
  (setRta)="closeDialogAlert($event)"></app-modal-alert>

  <app-modal-department
  *ngIf="visibleDialogCategory"
  [select]="true"
  [visible]="visibleDialogCategory"
  [message]="message"
  [buttonmsg]="buttonmsg"
  [read_only]="read_only"
  [departmentForm]="department_details"
  (setRta)="closeDialogGender($event)"
  (setRtaParameter)="setParameter($event)"></app-modal-department>
