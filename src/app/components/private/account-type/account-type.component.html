<div class="row mb-2">
  <div class="col-10">
    <div class="title-page">Parametrizar tipo de cuenta</div>
  </div>
  <div class="col-2">
    <p-button label="Crear tipo de cuenta" (click)="createAccountType()"></p-button>
  </div>
</div>
<div class="row mt-auto">
  <div class="col-12">
    <p-table
      [value]="accountTypeList"
      [scrollable]="true"
      scrollHeight="400px"
      selectionMode="single"
      [paginator]="false"
      [rows]="5"
      [showCurrentPageReport]="true"
      [tableStyle]="{ 'min-width': '50rem' }"
      currentPageReportTemplate="{first} de {totalRecords}">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="account_type_id" style="width: 15%">
            Código<p-sortIcon field="account_type_id"></p-sortIcon>
          </th>
          <th style="width: 35%">Tipo de cuenta</th>
          <th style="width: 15%">Estado</th>
          <th style="width: 10%"></th>
          <!--<th style="width: 10%"></th>-->
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-accountTypeList>
        <tr>
          <td [ngStyle]="{ 'text-align': 'center' }">{{ accountTypeList.account_type_id }}</td>
          <td>{{ accountTypeList.account_type_name }}</td>
          <td class="d-flex">
            <p-inputSwitch
              [(ngModel)]="accountTypeList.is_active"
              (onChange)="inActiveAccountType(accountTypeList)"></p-inputSwitch>
            <div
              class="d-flex align-items-center ms-2"
              [ngClass]="{ 'input-switch-label': accountTypeList.is_active }">
              {{ accountTypeList.is_active ? 'Activo' : 'Inactivo' }}
            </div>
          </td>
          <td [ngStyle]="{ 'text-align': 'center' }">
            <p-button
              icon="pi pi-pencil"
              [styleClass]="'btn-icon-warning'"
              (click)="editAccountType(accountTypeList)"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
    <p-paginator
      (onPageChange)="onPageChange($event)"
      [first]="first"
      [rows]="rows"
      [totalRecords]="totalRows"
      [rowsPerPageOptions]="[10, 20, 30]"></p-paginator>
  </div>
</div>
<p-toast></p-toast>
<app-modal-dinamic
  *ngIf="visibleDialog"
  [select]="true"
  [visible]="visibleDialog"
  [message]="message"
  (setRta)="closeDialog($event)"></app-modal-dinamic>

<app-modal-alert
  *ngIf="visibleDialogAlert"
  [select]="true"
  [visible]="visibleDialogAlert"
  [message]="message"
  [informative]="informative"
  [severity]="severity"
  (setRta)="closeDialogAlert($event)"></app-modal-alert>

<app-modal-account-type
  *ngIf="visibleDialogAccountType"
  [select]="true"
  [visible]="visibleDialogAccountType"
  [message]="message"
  [buttonmsg]="buttonmsg"
  [read_only]="read_only"
  [accountTypeForm]="account_type_details"
  (setRta)="closeDialogAccountType($event)"
  (setRtaParameter)="setParameter($event)"></app-modal-account-type>
