<div class="row mb-2">
  <div class="col-10">
    <div class="title-page">Parametrizar motivos de rechazo</div>
  </div>
  <div class="col-2">
    <p-button label="Crear nueva" (click)="createMotivo()"></p-button>
  </div>
</div>
<div class="row mt-auto">
  <div class="col-12">
    <p-table
      [value]="motivoRechazoList"
      [scrollable]="true"
      scrollHeight="600px"
      selectionMode="single"
      [paginator]="false"
      [rows]="20"
      [showCurrentPageReport]="true"
      [tableStyle]="{ 'min-width': '50rem' }"
      currentPageReportTemplate="{first} de {totalRecords}">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id" style="width: 5%">
            Id<p-sortIcon field="id"></p-sortIcon>
          </th>
          <th style="width: 12%">Código motivo</th>
          <th style="width: 35%">Descripción</th>
          <th style="width: 10%">Estado</th>
          <th style="width: 5%">Modificar</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td [ngStyle]="{ 'text-align': 'center' }">{{ row.id }}</td>
          <td [ngStyle]="{ 'text-align': 'center' }">{{ row.codigo_motivo }}</td>
          <td [ngStyle]="{ 'text-align': 'center' }">{{ row.descripcion_motivo || row.motivo_rechazo }}</td>
          <td [ngStyle]="{ 'text-align': 'center' }">
            <div class="d-flex flex-column align-items-center gap-1">
              <p-inputSwitch
                [(ngModel)]="row.esta_activo"
                (onChange)="inActiveMotivo(row)">
              </p-inputSwitch>
              <div [ngClass]="{ 'input-switch-label': row.esta_activo }">
                {{ row.esta_activo ? 'Activo' : 'Inactivo' }}
              </div>
            </div>
          </td>
          <td [ngStyle]="{ 'text-align': 'center' }">
            <p-button
              icon="pi pi-pencil"
              [styleClass]="'btn-icon-warning'"
              (click)="editMotivo(row)"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
    <p-paginator
      (onPageChange)="onPageChange($event)"
      [first]="first"
      [rows]="rows"
      [totalRecords]="totalRows"
      [rowsPerPageOptions]="[10, 20, 30]"></p-paginator>
  </div>
</div>
<p-toast></p-toast>

<app-modal-dinamic
  *ngIf="visibleDialog"
  [select]="true"
  [visible]="visibleDialog"
  [message]="message"
  (setRta)="closeDialog($event)"></app-modal-dinamic>

<app-modal-alert
  *ngIf="visibleDialogAlert"
  [select]="true"
  [visible]="visibleDialogAlert"
  [message]="message"
  [informative]="informative"
  [severity]="severity"
  (setRta)="closeDialogAlert($event)"></app-modal-alert>

<app-modal-input
  *ngIf="visibleDialogInput"
  [select]="true"
  [visible]="visibleDialogInput"
  [message]="message"
  [buttonmsg]="buttonmsg"
  [parameter]="parameter"
  [oneField]="false"
  [inputForm]="inputForm"
  (setRta)="closeDialogInput($event)"
  (setRtaParameter)="setParameter($event)"></app-modal-input>
