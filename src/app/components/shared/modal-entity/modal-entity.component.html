<p-dialog [(visible)]="visible" [style]="{ width: '40vw' }" [modal]="true">
  <ng-template pTemplate="headless">
    <div class="modal-content">
      <div class="login-form-header">
        <div class="login-form-header__item login-form-header__item_1"></div>
        <div class="login-form-header__item login-form-header__item_2"></div>
        <div class="login-form-header__item login-form-header__item_3"></div>
        <div class="login-form-header__item login-form-header__item_4"></div>
        <div class="login-form-header__item login-form-header__item_5"></div>
        <div class="login-form-header__item login-form-header__item_6"></div>
      </div>
      <div class="row my-4 px-5">
        <div class="col-12 text-center">{{ message }}</div>
      </div>
      <form [formGroup]="formGroup">
        <div class="row my-4 px-5">
          <div class="col-12">
            <label> Código </label>
            <input
              [readonly]="this.buttonmsg !== 'Crear' ? true : false"
              formControlName="entity_code"
              pInputText
              pKeyFilter="string"
              placeholder="Escriba el código" />
            <label class="invalid">
              {{
                formGroup.get('entity_code')?.hasError('required') &&
                formGroup.get('entity_code')?.touched
                  ? 'Campo requerido'
                  : ''
              }}{{
                formGroup.get('entity_code')?.hasError('pattern') &&
                formGroup.get('entity_code')?.touched
                  ? 'Ingrese solo números o letras'
                  : ''
              }}</label
            >
          </div>
          <div class="col-12">
            <label> Nombre de la entidad </label>
            <input
              [readonly]="read_only"
              formControlName="entity_name"
              pInputText
              pKeyFilter="string"
              placeholder="Escriba nombre" />
            <label class="invalid">
              {{
                formGroup.get('entity_name')?.hasError('required') &&
                formGroup.get('entity_name')?.touched
                  ? 'Campo requerido'
                  : ''
              }}{{
                formGroup.get('entity_name')?.hasError('pattern') &&
                formGroup.get('entity_name')?.touched
                  ? 'Ingrese solo letras'
                  : ''
              }}</label
            >
          </div>
          <div class="col-12" [style]="{ display: 'flex', 'flex-direction': 'column' }">
            <label> Tipos de entidad </label>
            <p-dropdown
              formControlName="entity_type_id"
              [style]="{ height: '30px', width: '100%' }"
              [options]="entityTypeList"
              optionLabel="entity_type_name"
              [disabled]="read_only"
              optionValue="entity_type_id"
              placeholder="Seleccione una opción"></p-dropdown>
          </div>
        </div>
      </form>
      <div *ngIf="read_only">
        <div class="row my-4 px-5">
          <div class="col-12 d-flex justify-content-evenly">
            <p-button label="Cerrar" severity="secondary" (click)="closeDialog(false)"></p-button>
          </div>
        </div>
      </div>
      <div *ngIf="!read_only">
        <div class="row my-4 px-5">
          <div class="col-12 d-flex justify-content-evenly">
            <p-button label="Cancelar" severity="secondary" (click)="closeDialog(false)"></p-button>
            <p-button
              [label]="buttonmsg"
              [disabled]="!formGroup.valid"
              (click)="closeDialog(true)"></p-button>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
</p-dialog>
